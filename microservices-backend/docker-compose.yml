version: '3.8'

services:
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    expose:
      - "5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@auth-postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: your-secret-key
    depends_on:
      auth-postgres:
        condition: service_healthy

  group-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: group_db
    expose:
      - "5432"
    volumes:
      - group_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  group-service:
    build:
      context: ./services/group-service
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      PORT: 8081
      DATABASE_URL: postgres://postgres:postgres@group-postgres:5432/group_db?sslmode=disable
    depends_on:
      group-postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: your-secret-key
      AUTH_SERVICE_URL: http://auth-service:8080
      GROUP_SERVICE_URL: http://group-service:8081
      TASK_SERVICE_URL: http://task-service:8082
    depends_on:
      - auth-service
      - group-service

volumes:
  auth_postgres_data:
  group_postgres_data: